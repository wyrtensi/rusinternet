<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Российские сертификаты — RusInternet</title>
  <desc id="description">Безопасная установка российских доверенных сертификатов для популярных операционных систем.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8faff"/>
      <stop offset="1" stop-color="#eef3fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2563eb"/>
      <stop offset="1" stop-color="#5f83e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#1d4ed8" flood-opacity=".12"/>
    </filter>
    <clipPath id="small-band"><rect x="15" y="11" width="34" height="18" rx="2.5"/></clipPath>
    <clipPath id="big-band"><rect x="836" y="196" width="168" height="78" rx="10"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1120" cy="42" r="230" fill="#dfe9ff" opacity=".55"/>
  <circle cx="58" cy="618" r="190" fill="#e7efff" opacity=".72"/>
  <rect x="48" y="44" width="1104" height="542" rx="42" fill="#fff" stroke="#dfe6f1" stroke-width="2" filter="url(#shadow)"/>

  <g transform="translate(96 82)">
    <rect x="9" y="5" width="46" height="54" rx="7" fill="#fff" stroke="#2563eb" stroke-width="4"/>
    <g clip-path="url(#small-band)">
      <path fill="#fff" d="M15 11h34v6H15z"/>
      <path fill="#1d4ed8" d="M15 17h34v6H15z"/>
      <path fill="#dc2626" d="M15 23h34v6H15z"/>
    </g>
    <rect x="15" y="11" width="34" height="18" rx="2.5" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M16 37h20" stroke="#93b4f5" stroke-width="3.5" stroke-linecap="round"/>
    <path d="m30 46 5.5 5.5L47 39" fill="none" stroke="#12a463" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="176" y="121" fill="#101828" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="750">Доступ в российский интернет</text>

  <text x="96" y="252" fill="#101828" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-2">Российские</text>
  <text x="96" y="326" fill="url(#accent)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-2">сертификаты</text>
  <text x="100" y="388" fill="#5f6b7f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="450">Безопасная установка для Windows, macOS,</text>
  <text x="100" y="426" fill="#5f6b7f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="450">Linux, Android и iOS</text>

  <g transform="translate(96 494)">
    <rect width="248" height="52" rx="16" fill="#eef3ff" stroke="#d9e4fb"/>
    <circle cx="27" cy="26" r="7" fill="#12a463"/>
    <text x="47" y="34" fill="#1d4ed8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">rusinternet.com</text>
  </g>

  <circle cx="920" cy="315" r="182" fill="#edf3ff"/>
  <rect x="808" y="168" width="224" height="294" rx="26" fill="#fff" stroke="#2563eb" stroke-width="12" filter="url(#shadow)"/>
  <g clip-path="url(#big-band)">
    <path fill="#fff" d="M836 196h168v26H836z"/>
    <path fill="#1d4ed8" d="M836 222h168v26H836z"/>
    <path fill="#dc2626" d="M836 248h168v26H836z"/>
  </g>
  <rect x="836" y="196" width="168" height="78" rx="10" fill="none" stroke="#cbd5e1" stroke-width="3"/>
  <path d="M842 316h156M842 352h112" stroke="#93b4f5" stroke-width="14" stroke-linecap="round"/>
  <g transform="translate(948 382)">
    <circle cx="40" cy="40" r="40" fill="#fff" stroke="#dfe6f1" stroke-width="2"/>
    <circle cx="40" cy="40" r="29" fill="#e7f8ef"/>
    <path d="m25 40 10 10 21-22" fill="none" stroke="#12a463" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
