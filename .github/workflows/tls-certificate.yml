name: Check TLS certificate

on:
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check the site certificate expiry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      # The bash shell runs with pipefail, so a problem still fails the step.
      - name: Check certificates
        run: node scripts/check-tls.mjs 2>&1 | tee tls-report.txt
        shell: bash

      # Caddy renews on its own; an issue here means it has been failing and a
      # person should look at the server (docker logs edge-caddy).
      - name: Open an issue when renewal looks broken
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: TLS certificate is not renewing
        run: |
          if [ -z "$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[].number')" ]; then
            {
              echo 'The weekly check found a problem with the live TLS certificate:'
              echo
              echo '```'
              cat tls-report.txt
              echo '```'
              echo
              echo 'Caddy renews certificates about 30 days before expiry. Check `docker logs edge-caddy` on the server.'
              echo
              echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > issue.md
            gh issue create --title "$TITLE" --body-file issue.md
          fi
