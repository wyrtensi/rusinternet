version: "2.4"

# Shared GoatCounter for rusinternet.com, wystore.ru and washguide.ru: no
# cookies, no stored IP addresses. One GoatCounter site (stats.wyrtensi.ru)
# counts all three; each page records its path with the host in front.
# Lives in /opt/stats on the server. No published ports: edge-caddy serves the
# dashboard on stats.wyrtensi.ru and each site proxies /stats/count* here.
services:
  goatcounter:
    image: arp242/goatcounter:2.7.0
    container_name: goatcounter
    restart: unless-stopped
    command: ["serve", "-listen", ":8080", "-tls", "http", "-automigrate", "-db", "sqlite+/home/goatcounter/goatcounter-data/db.sqlite3"]
    volumes:
      - ./data:/home/goatcounter/goatcounter-data
    networks:
      - proxy
    mem_limit: 96m
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"

networks:
  proxy:
    external: true
